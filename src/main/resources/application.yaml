spring:
  application.name: pathos-auth
  mvc.formcontent.filter.enabled: false
  datasource:
    url: ${PATHOS_AUTH_DB_URL:jdbc:postgresql://localhost:5432/pathos_auth}
    username: ${PATHOS_AUTH_DB_USER:pathos_auth}
    password: ${PATHOS_AUTH_DB_PASSWORD:pathos_auth}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PATHOS_AUTH_PORT:8081}
  # the sign-in page sits behind a reverse proxy: redirects and the cookie must know it is https
  forward-headers-strategy: native
  tomcat.remoteip.internal-proxies: ${PATHOS_AUTH_TRUSTED_PROXIES:10\\.\\d+\\.\\d+\\.\\d+|172\\.(1[6-9]|2\\d|3[01])\\.\\d+\\.\\d+|192\\.168\\.\\d+\\.\\d+|127\\.\\d+\\.\\d+\\.\\d+|30\\.0\\.0\\.\\d+}
  servlet.session:
    timeout: 14d
    cookie:
      name: PATHOS
      http-only: true
      same-site: lax

management:
  # metrics go out on their own port so the gateway never serves them
  server.port: ${PATHOS_AUTH_MANAGEMENT_PORT:${PATHOS_AUTH_PORT:8081}}
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true

pathos.auth.jwt:
  private-key-path: ${PATHOS_AUTH_JWT_KEY}
  issuer: ${PATHOS_AUTH_JWT_ISSUER:http://localhost:8081}
  key-id: ${PATHOS_AUTH_JWT_KEY_ID:pathos-auth-1}
  access-ttl: ${PATHOS_AUTH_JWT_ACCESS_TTL:10m}

pathos.auth.session:
  refresh-ttl: ${PATHOS_AUTH_REFRESH_TTL:30d}

# Services that offer "sign in with pathos", e.g.
#   PATHOS_AUTH_OAUTH_CLIENTS_FORUM_SECRET, PATHOS_AUTH_OAUTH_CLIENTS_FORUM_REDIRECT_URIS (comma separated),
#   PATHOS_AUTH_OAUTH_CLIENTS_FORUM_ACCESS (the name an admin ticks for an account, empty = everyone)
pathos.auth.oauth:
  clients: {}

pathos.auth.admin:
  username: ${PATHOS_AUTH_ADMIN_USERNAME:}
  password: ${PATHOS_AUTH_ADMIN_PASSWORD:}

logging.level:
  com.microchip.pathos_auth: INFO
